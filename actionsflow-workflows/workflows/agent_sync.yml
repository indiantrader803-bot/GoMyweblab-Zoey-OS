name: agent_autonomous_sync
on:
  poll:
    url: http://127.0.0.1:8088/api/status
    interval: 15m
jobs:
  run_agent_lifecycle:
    name: Execute Autonomous Swarm Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Agent Cycle
        uses: actionsflow/axios@v1
        with:
          url: http://127.0.0.1:8088/api/trigger-cycle
          method: GET
